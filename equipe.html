<div id="site-header"></div>
<main>
<section class="hero page" data-img="banniere-equipe" style="background-image:url('images/equipe.jpg')"><div class="wrap"><h1 data-cms="h1_3eeec8f">Équipe pédagogique</h1><p data-cms="p_ca7dc29" class="lead">Ceux qui font vivre le lycée au quotidien.</p></div></section>

<section class="section"><div class="wrap"><div id="eq"><p style="color:var(--gris)">Chargement…</p></div></div></section>
</main>
<div id="site-footer"></div>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

<script src="assets/faq-data.js?v=24.0"></script>
<script src="assets/extras.js?v=24.0"></script>
<script>
(async function(){
  /* Les profils de l'équipe ne sont plus visibles par les visiteurs : réservés aux membres connectés (élèves, parents, personnel). */
  try{ if(window.Session&&Session.ready) await Session.ready; }catch(e){}
  const u=window.Session&&Session.authUser;
  if(!u||u.isAnonymous){ document.getElementById("eq").innerHTML='<p>Les profils de l\'équipe du lycée sont réservés aux membres connectés (élèves, parents et personnel).</p><p><a class="btn dark" href="connexion.html">Se connecter</a></p>'; return; }
  let defaut=SITE.direction.membres.map(x=>[x.g||"Direction",x.n,x.f]);
  let l=[]; try{ if(DB){ const s=await DB.collection("personnel").get(); s.forEach(d=>{const x=d.data(); l.push([x.categorie||"Personnel",x.nom,x.fonction,x.photo]);}); } }catch(e){}
  if(!l.length){ try{ if(DB){ const d=await DB.collection("contenu_site").doc("direction").get(); if(d.exists&&Array.isArray(d.data().membres)) defaut=d.data().membres.map(x=>[x.g||"Direction",x.n,x.f]); } }catch(e){} }
  const base = l.length ? l : defaut;
  const ordre=["Direction","Enseignants","Personnel"]; let h="";
  ordre.forEach(c=>{ const g=base.filter(x=>x[0]===c); if(!g.length) return;
    h+="<h2>"+(c==="Direction"?"La <em>direction</em>":c==="Enseignants"?"Les <em>enseignants</em>":"Le <em data-en=\"staff\">personnel</em>")+'</h2><div class="pers">'+g.map(x=>{const ini=x[1].replace(/^(M\.|Mme)\s+/,"").split(" ").map(w=>w[0]).slice(0,2).join("");
      return "<figure>"+(x[3]?'<div class="ph" style="background-image:url(\''+esc(cld(x[3],500))+'\')" role="img" aria-label="'+esc(x[1])+'"></div>':'<div class="ph">'+esc(ini)+"</div>")+"<b>"+esc(x[1])+"</b><span>"+esc(x[2])+"</span></figure>";}).join("")+"</div>"; });
  document.getElementById("eq").innerHTML=h;
})();
</script>
</body>
</html>
