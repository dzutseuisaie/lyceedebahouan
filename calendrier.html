<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Calendrier | Lycée de Bahouan</title>
<meta name="description" content="Calendrier du Lycée de Bahouan : événements, dates importantes et vie de l’établissement.">
<link rel="icon" type="image/jpeg" href="images/logo.jpg">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a2a5c">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css?v=24.0">
<style>#cal td{height:92px;vertical-align:top;text-align:left;font-size:.85rem;width:14.28%}#cal td b{display:block;color:var(--gris);font-weight:600}#cal td.auj{background:#fff7e0}#cal td.hors{background:#f6f5f1;color:#bbb}#cal .ev{display:block;background:var(--nuit);color:#fff;padding:1px 5px;margin-top:3px;font-size:.75rem;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}@media(max-width:620px){#cal td{height:64px;font-size:.7rem}#cal .ev{display:none}#cal td.has b::after{content:" •";color:var(--or)}}</style>
</head>
<body>
<div id="site-header"></div>
<main>
<section class="hero page" data-img="banniere-calendrier" style="background-image:url('images/calendrier.jpg')"><div class="wrap"><h1 data-cms="h1_4c83736">Calendrier</h1><p data-cms="p_067fa50" class="lead">Les dates importantes du lycée.</p></div></section>

<section class="section"><div class="wrap">
  <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px"><button class="btn gris s" id="prec" type="button" aria-label="Mois précédent">←</button><h2 id="mois" style="margin:0;text-transform:capitalize"></h2><button class="btn gris s" id="suiv" type="button" aria-label="Mois suivant">→</button><button class="btn dark s" id="auj" type="button">Aujourd'hui</button></div>
  <div class="tbl-wrap" style="max-height:none"><table class="edt" id="cal"></table></div>
  <div class="evts" id="liste" style="margin-top:34px"></div>
</div></section>
</main>
<div id="site-footer"></div>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="assets/config.js?v=24.0"></script>
<script src="assets/site.js?v=24.0"></script>
<script src="assets/i18n.js?v=24.0"></script>
<script src="assets/auth.js?v=24.0"></script>
<script src="assets/faq-data.js?v=24.0"></script>
<script src="assets/extras.js?v=24.0"></script>
<script>
(async function(){
  const LOC=window.LOCALE||"fr-FR", FR=LOC==="fr-FR";
  const M=FR?["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"]:Array.from({length:12},(_,i)=>new Date(2024,i,1).toLocaleDateString(LOC,{month:"long"}));
  const J=FR?["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"]:Array.from({length:7},(_,i)=>new Date(2024,0,1+i).toLocaleDateString(LOC,{weekday:"short"}));
  let evs=[]; try{ if(DB){ const s=await DB.collection("evenements").orderBy("date").get(); s.forEach(d=>evs.push(Object.assign({id:d.id},d.data()))); } }catch(e){}
  let cur=new Date(); cur.setDate(1);
  const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  const surJour=k=>evs.filter(e=>e.date<=k&&k<=(e.fin||e.date));
  function ics(e){const f=s=>s.replace(/-/g,""); const t=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Lycee de Bahouan//FR","BEGIN:VEVENT","UID:"+e.id+"@lycee-de-bahouan","DTSTART;VALUE=DATE:"+f(e.date),"DTEND;VALUE=DATE:"+f(e.fin||e.date),"SUMMARY:"+(e.titre||""),"LOCATION:"+(e.lieu||""),"DESCRIPTION:"+(e.description||""),"END:VEVENT","END:VCALENDAR"].join("\r\n");
    const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([t],{type:"text/calendar"})); a.download="evenement.ics"; document.body.appendChild(a); a.click(); a.remove();}
  function rendre(){
    document.getElementById("mois").textContent=M[cur.getMonth()]+" "+cur.getFullYear();
    const premier=new Date(cur), dec=(premier.getDay()+6)%7, debut=new Date(cur); debut.setDate(1-dec);
    let h="<thead><tr>"+J.map(j=>"<th>"+j+"</th>").join("")+"</tr></thead><tbody>";
    for(let w=0;w<6;w++){ h+="<tr>"; for(let i=0;i<7;i++){ const d=new Date(debut); d.setDate(debut.getDate()+w*7+i); const k=iso(d), l=surJour(k);
      h+='<td class="'+(d.getMonth()!==cur.getMonth()?"hors":"")+(k===iso(new Date())?" auj":"")+(l.length?" has":"")+'"><b>'+d.getDate()+"</b>"+l.map(e=>'<span class="ev" title="'+esc(e.titre)+'">'+esc(e.titre)+"</span>").join("")+"</td>"; } h+="</tr>"; }
    document.getElementById("cal").innerHTML=h+"</tbody>";
    const dm=iso(cur).slice(0,7), l=evs.filter(e=>e.date.slice(0,7)<=dm&&dm<=(e.fin||e.date).slice(0,7));
    document.getElementById("liste").innerHTML = l.length ? "<h3>Ce mois-ci</h3>"+l.map(e=>{const d=new Date(e.date+"T12:00:00"); return '<div class="evt"><div><b>'+d.getDate()+'</b><small>'+d.toLocaleDateString(LOC,{month:"long"})+'</small></div><div><h3 style="margin:0 0 4px;font-size:1.3rem">'+esc(e.titre)+'</h3><span style="color:var(--gris)">'+esc(e.lieu||"")+" "+esc(e.description||"")+'</span><br><button class="petit-lien" data-ics="'+e.id+'" type="button">Ajouter à mon agenda</button></div></div>';}).join("") : '<p style="color:var(--gris)">Aucun événement ce mois-ci.</p>';
  }
  document.getElementById("prec").onclick=()=>{cur.setMonth(cur.getMonth()-1);rendre();};
  document.getElementById("suiv").onclick=()=>{cur.setMonth(cur.getMonth()+1);rendre();};
  document.getElementById("auj").onclick=()=>{cur=new Date();cur.setDate(1);rendre();};
  document.addEventListener("click",e=>{const b=e.target.closest("[data-ics]"); if(b) ics(evs.find(x=>x.id===b.dataset.ics));});
  rendre();
})();
</script>
</body>
</html>
