<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">

<title>Galerie photos | Lycée de Bahouan</title>
<meta name="description" content="Les photos de la vie du Lycée de Bahouan.">
<link rel="icon" type="image/jpeg" href="images/logo.jpg">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a2a5c">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css?v=24.0">
</head>
<body>
<div id="site-header"></div>
<main>
<section class="hero page" data-img="banniere-galerie" style="background-image:url('images/galerie.jpg')"><div class="wrap"><h1 data-cms="h1_d1910ce">Galerie photos</h1><p data-cms="p_0190ed8" class="lead">La vie du lycée en images.</p></div></section>

<section class="section"><div class="wrap"><div id="albums" style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px"></div><div class="cartes" id="gal" style="margin-top:0"></div></div></section>
<div class="modal" id="lb"><div class="in" style="max-width:980px;padding:14px"><button class="x" data-fermer aria-label="Fermer" onclick="document.getElementById('lb').classList.remove('open')">×</button><img id="lb-i" alt="" style="width:100%;max-height:78vh;object-fit:contain"><p id="lb-t" style="margin:10px 0 0;text-align:center"></p></div></div>
</main>
<div id="site-footer"></div>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="assets/config.js?v=24.0"></script>
<script src="assets/site.js?v=24.0"></script>
<script src="assets/i18n.js?v=24.0"></script>
<script src="assets/auth.js?v=24.0"></script>
<script src="assets/faq-data.js?v=24.0"></script>
<script src="assets/extras.js?v=24.0"></script>
<script>
(async function(){
  let l=[]; try{ if(DB){ const s=await DB.collection("galerie").get(); s.forEach(d=>l.push(d.data())); } }catch(e){}
  l.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  const g=document.getElementById("gal"), a=document.getElementById("albums");
  if(!l.length){ g.innerHTML='<p style="color:var(--gris)">Les photos seront publiées bientôt.</p>'; return; }
  const albums=[...new Set(l.map(x=>x.album).filter(Boolean))]; let cur="";
  const rendre=()=>{ a.innerHTML=['Toutes'].concat(albums).map(n=>'<button type="button" class="btn s '+((n==="Toutes"&&!cur)||n===cur?"dark":"gris")+'" data-a="'+(n==="Toutes"?"":esc(n))+'">'+esc(n)+"</button>").join("");
    g.innerHTML=l.filter(x=>!cur||x.album===cur).map(x=>'<a class="carte" href="#" data-u="'+esc(cld(x.url,1400))+'" data-t="'+esc(x.titre||"")+'"><div class="im" style="background-image:url(\''+esc(cld(x.url,700))+'\')"></div><h3 style="font-size:1.1rem">'+esc(x.titre||"")+"</h3></a>").join(""); };
  a.addEventListener("click",e=>{const b=e.target.closest("[data-a]"); if(b){cur=b.dataset.a; rendre();}});
  g.addEventListener("click",e=>{const c=e.target.closest("[data-u]"); if(!c) return; e.preventDefault(); document.getElementById("lb-i").src=c.dataset.u; document.getElementById("lb-t").textContent=c.dataset.t; document.getElementById("lb").classList.add("open");});
  rendre();
})();
</script>
</body>
</html>
