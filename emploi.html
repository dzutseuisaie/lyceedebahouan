<script>
(function(){
  const sel=document.getElementById("e-c"); const remplir=()=>{ const v=sel.value; sel.innerHTML=L.options(SITE.classes, v); }; remplir(); (window.siteReady||Promise.resolve()).then(()=>{ remplir(); if(typeof charger==="function") charger(); });
  async function charger(){ let c={}; try{ if(DB) c=await L.emploi(sel.value); }catch(e){}
    document.getElementById("e-note").textContent = Object.keys(c).length ? "" : "L'emploi du temps de cette classe n'a pas encore été publié. Les horaires des périodes sont indiqués ci-dessous.";
    document.getElementById("e-t").innerHTML=L.emploiHtml(c,false); }
  sel.onchange=charger; charger();
})();
</script>
